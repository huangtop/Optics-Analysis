name: Update Supply Chain Stock Prices

on:
  # GitHub cron 使用 UTC
  # 00:20 UTC = 台北時間 08:20
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update stock price JSON
        run: |
          python "CPO Price.py"
          python "MLCC Price.py"

      - name: Check generated JSON
        run: |
          ls -lh public/data/cpo_stock_prices_1y.json
          ls -lh public/data/mlcc_stock_prices_1y.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/cpo_stock_prices_1y.json
          git add public/data/mlcc_stock_prices_1y.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update stock prices"
          git push